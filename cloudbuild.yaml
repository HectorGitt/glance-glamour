substitutions:
    _IMAGE_TAG: v${SHORT_SHA}

steps:
    # Build the Docker image
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "build"
          - "-t"
          - "gcr.io/$PROJECT_ID/avera:${_IMAGE_TAG}"
          - "."

    # Push the Docker image to Google Container Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "push"
          - "gcr.io/$PROJECT_ID/avera:${_IMAGE_TAG}"

    # Deploy to Cloud Run
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: gcloud
      args:
          - "run"
          - "deploy"
          - "avera"
          - "--image"
          - "gcr.io/$PROJECT_ID/avera:${_IMAGE_TAG}"
          - "--region"
          - "us-central1"
          - "--platform"
          - "managed"
          - "--allow-unauthenticated"
          - "--port"
          - "8080"
          - "--memory"
          - "1Gi"
          - "--cpu"
          - "1"

options:
    logging: CLOUD_LOGGING_ONLY
